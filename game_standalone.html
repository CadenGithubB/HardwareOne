function drawCoins2D() {
  if (!coinDrops || !coinDrops.length) return;
  var now = Date.now();
  ctx.save(); ctx.translate(-viewCam.x, -viewCam.y);
  for (var i = 0; i < coinDrops.length; i++) {
    var c = coinDrops[i];
    var bob = Math.sin(now * 0.004 + c.bob) * 3;
    ctx.fillStyle = '#ffd700';
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(c.x, c.y + bob, 5, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff8'; ctx.font = 'bold 5px Arial'; ctx.textAlign = 'center';
    ctx.fillText('$', c.x, c.y + bob + 2);
  }
  ctx.restore();
}

function drawCoins3D() {
  if (!coinDrops || !coinDrops.length) return;
  var w = canvas.width, h = canvas.height;
  var halfFov = cam.fov / 2;
  var cosAng = Math.cos(cam.ang), sinAng = Math.sin(cam.ang);
  var invTanHalf = 1 / Math.tan(halfFov);
  var pitchOff = Math.floor(-(cam.pitch || 0) * 180);
  var horizonY = Math.floor(h * 0.5) + pitchOff;
  var cameraZ = 60 + ((cam.z || 60) - 60) * (25 / 40);
  var now = Date.now();
  for (var i = 0; i < coinDrops.length; i++) {
    var coin = coinDrops[i];
    var dx = coin.x - cam.x, dy = coin.y - cam.y;
    var dist = Math.hypot(dx, dy);
    if (dist < 1 || dist > viewDist * 0.5) continue;
    var fwd = dx * cosAng + dy * sinAng;
    if (fwd < 1) continue;
    var rgt = dx * (-sinAng) + dy * cosAng;
    var screenX = Math.floor((rgt / fwd * invTanHalf * 0.5 + 0.5) * w);
    if (depthBuffer && screenX >= 0 && screenX < depthBuffer.length && fwd > depthBuffer[screenX] + 3) continue;
    var fh = floorMesh ? getFloorHeightAt(coin.x, coin.y) : 0;
    var floorY = horizonY + Math.floor(((cameraZ - fh * 25) / fwd) * 180);
    floorY = Math.min(floorY, h + 10);
    var sz = Math.max(4, Math.min(14, Math.floor(h * 0.18 / (fwd * 0.12 + 1))));
    var bob = Math.sin(now * 0.004 + coin.bob) * 3;
    var cy = floorY - sz * 1.2 + bob;
    ctx.save();
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffd700';
    ctx.fillStyle = '#ffd700'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(screenX, cy, sz, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffffcc'; ctx.font = 'bold ' + Math.max(6, sz) + 'px Arial'; ctx.textAlign = 'center';
    ctx.fillText('$', screenX, cy + sz * 0.35);
    ctx.shadowBlur = 0; ctx.restore();
  }
}

// ── Ambient Atmospheric Particles ──────────────────────────────────────
var AMBIENT_MAX = 35;

function spawnAmbientParticle(nearX, nearY, terrainType) {
  var ang = Math.random() * Math.PI * 2;
  var rad = 30 + Math.random() * 150;
  var px = nearX + Math.cos(ang) * rad;
  var py = nearY + Math.sin(ang) * rad;
  var p = {x: px, y: py, z: 0, vx: 0, vy: 0, vz: 0, alpha: 0, maxAlpha: 0.25,
           life: 0, maxLife: 3, size: 1.5, type: 'dust', r: 180, g: 160, b: 120};

  if (terrainType === 'ice') {
    var roll = Math.random();
    if (roll < 0.6) {
      // snowflake — drifts down slowly
      p.type = 'snowflake'; p.size = 1 + Math.random() * 2;
      p.vx = (Math.random() - 0.5) * 8; p.vy = (Math.random() - 0.5) * 8;
      p.vz = -(5 + Math.random() * 10);
      p.z = 30 + Math.random() * 40;
      p.maxAlpha = 0.25 + Math.random() * 0.2;
      p.maxLife = 4 + Math.random() * 3;
      p.r = 210; p.g = 230; p.b = 255;
    } else {
      // ice sparkle — brief flash
      p.type = 'sparkle'; p.size = 1 + Math.random();
      p.z = 2 + Math.random() * 15;
      p.maxAlpha = 0.4 + Math.random() * 0.3;
      p.maxLife = 0.8 + Math.random() * 1.2;
      p.r = 180; p.g = 220; p.b = 255;
    }
  } else if (terrainType === 'cave') {
    var roll = Math.random();
    if (roll < 0.5) {
      // water drip — falls straight down
      p.type = 'drip'; p.size = 1.5;
      p.vz = -(20 + Math.random() * 15);
      p.z = 35 + Math.random() * 30;
      p.maxAlpha = 0.35 + Math.random() * 0.15;
      p.maxLife = 1.5 + Math.random() * 1.5;
      p.r = 80; p.g = 120; p.b = 200;
    } else {
      // spore mote — drifts up slowly
      p.type = 'spore'; p.size = 1 + Math.random() * 1.5;
      p.vx = (Math.random() - 0.5) * 5; p.vy = (Math.random() - 0.5) * 5;
      p.vz = 2 + Math.random() * 4;
      p.z = 3 + Math.random() * 10;
      p.maxAlpha = 0.2 + Math.random() * 0.15;
      p.maxLife = 4 + Math.random() * 4;
      p.r = 120; p.g = 190; p.b = 80;
    }
  } else if (terrainType === 'expanse') {
    var roll = Math.random();
    if (roll < 0.7) {
      // sand dust — drifts horizontally
      p.type = 'dust'; p.size = 1 + Math.random() * 1.5;
      p.vx = 8 + Math.random() * 12; p.vy = (Math.random() - 0.5) * 6;
      p.vz = (Math.random() - 0.5) * 3;
      p.z = 3 + Math.random() * 20;
      p.maxAlpha = 0.15 + Math.random() * 0.15;
      p.maxLife = 3 + Math.random() * 3;
      p.r = 200; p.g = 180; p.b = 140;
    } else {
      // heat shimmer
      p.type = 'shimmer'; p.size = 2 + Math.random() * 2;
      p.vz = 1 + Math.random() * 3;
      p.z = 5 + Math.random() * 15;
      p.maxAlpha = 0.08 + Math.random() * 0.08;
      p.maxLife = 2 + Math.random() * 2;
      p.r = 255; p.g = 240; p.b = 200;
    }
  } else {
    // ground / plains — dust motes and fireflies
    var roll = Math.random();
    if (roll < 0.8) {
      p.type = 'dust'; p.size = 1 + Math.random();
      p.vx = (Math.random() - 0.5) * 6; p.vy = (Math.random() - 0.5) * 6;
      p.vz = (Math.random() - 0.5) * 2;
      p.z = 5 + Math.random() * 20;
      p.maxAlpha = 0.18 + Math.random() * 0.12;
      p.maxLife = 3 + Math.random() * 4;
      p.r = 180; p.g = 160; p.b = 120;
    } else {
      // firefly — gentle green glow
      p.type = 'firefly'; p.size = 1.5;
      p.vx = (Math.random() - 0.5) * 10; p.vy = (Math.random() - 0.5) * 10;
      p.vz = (Math.random() - 0.5) * 5;
      p.z = 8 + Math.random() * 20;
      p.maxAlpha = 0.3 + Math.random() * 0.3;
      p.maxLife = 3 + Math.random() * 5;
      p.r = 150; p.g = 255; p.b = 80;
    }
  }
  p.life = p.maxLife;
  return p;
}

function initAmbientParticles() {
  ambientParticles = [];
  var px = pos ? pos.x : worldW * 0.5;
  var py = pos ? pos.y : worldH * 0.5;
  for (var i = 0; i < AMBIENT_MAX; i++) {
    var p = spawnAmbientParticle(px, py, terrain);
    p.life = Math.random() * p.maxLife; // stagger initial lifetimes
    ambientParticles.push(p);
  }
}

function updateAmbientParticles(dt) {
  var px = pos ? pos.x : 0, py = pos ? pos.y : 0;
  for (var i = 0; i < ambientParticles.length; i++) {
    var p = ambientParticles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    if (p.z < 0) p.z = 0;
    p.life -= dt;
    // Fade in during first 20% of life, fade out during last 30%
    var lifeRatio = p.life / p.maxLife;
    if (lifeRatio > 0.8) p.alpha = p.maxAlpha * ((1 - lifeRatio) / 0.2);
    else if (lifeRatio < 0.3) p.alpha = p.maxAlpha * (lifeRatio / 0.3);
    else p.alpha = p.maxAlpha;
    // Firefly pulse
    if (p.type === 'firefly') p.alpha *= 0.5 + 0.5 * Math.sin(Date.now() * 0.005 + i * 2.1);
    // Respawn if expired or too far from player
    var distToPlayer = Math.hypot(p.x - px, p.y - py);
    if (p.life <= 0 || distToPlayer > 250) {
      var np = spawnAmbientParticle(px, py, terrain);
      ambientParticles[i] = np;
    }
  }
}

function drawAmbientParticles3D() {
  if (!ambientParticles.length || !MODE3D) return;
  var w = canvas.width, h = canvas.height;
  var halfFov = cam.fov / 2;
  var cosAng = Math.cos(cam.ang), sinAng = Math.sin(cam.ang);
  var invTanHalf = 1 / Math.tan(halfFov);
  var pitchOff = Math.floor(-(cam.pitch || 0) * 180);
  var horizonY = Math.floor(h * 0.5) + pitchOff;
  var cameraZ = 60 + ((cam.z || 60) - 60) * (25 / 40);

  for (var i = 0; i < ambientParticles.length; i++) {
    var p = ambientParticles[i];
    if (p.alpha < 0.02) continue;
    var dx = p.x - cam.x, dy = p.y - cam.y;
    var fwd = dx * cosAng + dy * sinAng;
    if (fwd < 1) continue;
    var rgt = dx * (-sinAng) + dy * cosAng;
    var screenX = Math.floor((rgt / fwd * invTanHalf * 0.5 + 0.5) * w);
    if (screenX < -5 || screenX > w + 5) continue;
    var wz = p.z * 25;
    var screenY = horizonY + Math.floor(((cameraZ - wz) / fwd) * 180);
    if (screenY < -5 || screenY > h + 5) continue;
    var sz = Math.max(1, p.size * 180 / fwd * 0.15);

    ctx.globalAlpha = p.alpha;
    if (p.type === 'firefly') {
      // Glow halo
      ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',0.15)';
      ctx.beginPath(); ctx.arc(screenX, screenY, sz * 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';
    if (p.type === 'drip') {
      ctx.fillRect(screenX, screenY, Math.max(1, sz * 0.5), Math.max(2, sz * 2));
    } else {
      ctx.beginPath(); ctx.arc(screenX, screenY, sz, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1.0;
}

function drawShopMarker2D() {
  if (!shopMarker) return;
  var now = Date.now();
  ctx.save(); ctx.translate(-viewCam.x, -viewCam.y);
  var pulse = 0.7 + 0.3 * Math.sin(now * 0.003);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffcc44';
  ctx.strokeStyle = '#aa8800';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(shopMarker.x, shopMarker.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#000'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
  ctx.fillText('$', shopMarker.x, shopMarker.y + 4);
  ctx.restore();
}

function drawShopMarker3D() {
  if (!shopMarker) return;
  var w = canvas.width, h = canvas.height;
  var halfFov = cam.fov / 2;
  var cosAng = Math.cos(cam.ang), sinAng = Math.sin(cam.ang);
  var invTanHalf = 1 / Math.tan(halfFov);
  var pitchOff = Math.floor(-(cam.pitch || 0) * 180);
  var horizonY = Math.floor(h * 0.5) + pitchOff;
  var cameraZ = 60 + ((cam.z || 60) - 60) * (25 / 40);
  var now = Date.now();
  var dx = shopMarker.x - cam.x, dy = shopMarker.y - cam.y;
  var dist = Math.hypot(dx, dy);
  if (dist < 1 || dist > 600) return;
  var fwd = dx * cosAng + dy * sinAng;
  if (fwd < 1) return;
  var rgt = dx * (-sinAng) + dy * cosAng;
  var screenX = Math.floor((rgt / fwd * invTanHalf * 0.5 + 0.5) * w);
  var fh = floorMesh ? getFloorHeightAt(shopMarker.x, shopMarker.y) : 0;
  var groundWZ  = fh * 25;
  var poleTopWZ = groundWZ + 58;
  var boardBotWZ = groundWZ + 28;
  var project = function(wz) { return horizonY + Math.floor(((cameraZ - wz) / fwd) * 180); };
  var signTopY  = Math.max(-40, project(poleTopWZ));
  var signBotY  = Math.min(h + 20, project(boardBotWZ));
  var signBoardH = Math.max(4, signBotY - signTopY);
  var signMidY  = (signTopY + signBotY) * 0.5;
  // Width: project a fixed world half-width using the same angular formula as screenX.
  // Both width and height now divide by dist equally → constant aspect ratio at any distance.
  // worldSignHW = 10 world units gives roughly square proportions given the 180px height scale.
  var worldSignHW = 10;
  var signHalfW = Math.max(4, Math.floor(worldSignHW * w / (2 * fwd * halfFov)));
  var pulse = 0.75 + 0.25 * Math.sin(now * 0.003);
  ctx.save();
  ctx.shadowBlur = 20 * pulse; ctx.shadowColor = '#ffcc44';
  ctx.globalAlpha = 0.92 * pulse;
  // Sign board — both dimensions derived from world-space so aspect ratio is distance-invariant
  ctx.fillStyle = '#3a2a08'; ctx.strokeStyle = '#ffcc44'; ctx.lineWidth = 2;
  ctx.fillRect(screenX - signHalfW, signTopY, signHalfW * 2, signBoardH);
  ctx.strokeRect(screenX - signHalfW, signTopY, signHalfW * 2, signBoardH);
  // $ glyph centred in the board
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold ' + Math.max(8, Math.floor(signBoardH * 0.72)) + 'px serif';
  ctx.textAlign = 'center';
  ctx.fillText('$', screenX, signMidY + signBoardH * 0.22);
  // No floating text on the sign — the HUD prompt below handles the interaction hint
  ctx.shadowBlur = 0; ctx.globalAlpha = 1.0; ctx.restore();
}

// Cave entrance beacon — eerie teal glow pillar visible from far in 3D.
// Shows up on every cave entrance stored in deepCaveEntrances[].
function drawCaveEntrance3D() {
  if (!deepCaveEntrances || !deepCaveEntrances.length) return;
  var w = canvas.width, h = canvas.height;
  var halfFov = cam.fov / 2;
  var cosAng = Math.cos(cam.ang), sinAng = Math.sin(cam.ang);
  var invTanHalf = 1 / Math.tan(halfFov);
  var pitchOff = Math.floor(-(cam.pitch || 0) * 180);
  var horizonY = Math.floor(h * 0.5) + pitchOff;
  var cameraZ = 60 + ((cam.z || 60) - 60) * (25 / 40);
  var now = Date.now();
  var project = function(wz, f) { return horizonY + Math.floor(((cameraZ - wz) / f) * 180); };

  for (var ei = 0; ei < deepCaveEntrances.length; ei++) {
    var ce = deepCaveEntrances[ei];
    var dx = ce.x - cam.x, dy = ce.y - cam.y;
    var dist = Math.hypot(dx, dy);
    if (dist < 1 || dist > 900) continue;
    var fwd = dx * cosAng + dy * sinAng;
    if (fwd < 1) continue;
    var rgt = dx * (-sinAng) + dy * cosAng;
    var screenX = Math.floor((rgt / fwd * invTanHalf * 0.5 + 0.5) * w);

    var fh = floorMesh ? getFloorHeightAt(ce.x, ce.y) : 0;
    var groundWZ = fh * 25;

    // Pillar: floor → tall top
    var pillarH = 80;
    var topY  = project(groundWZ + pillarH, fwd);
    var botY  = project(groundWZ,           fwd);
    var beamH = Math.max(4, botY - topY);

    // Width proportional to distance like shop sign
    var pillarHW = Math.max(3, Math.floor(12 * w / (2 * fwd * halfFov)));

    var pulse = 0.6 + 0.4 * Math.sin(now * 0.0025 + ei * 1.7);
    var flicker = 0.85 + 0.15 * Math.sin(now * 0.011 + ei * 3.3);
    var alpha = Math.min(1.0, 0.82 * pulse * flicker * (1.0 - dist / 1100));

    ctx.save();
    ctx.globalAlpha = alpha;

    // Outer glow halo
    var grad = ctx.createLinearGradient(screenX - pillarHW * 3, 0, screenX + pillarHW * 3, 0);
    grad.addColorStop(0,   'rgba(0,255,200,0)');
    grad.addColorStop(0.35,'rgba(0,220,180,0.18)');
    grad.addColorStop(0.5, 'rgba(0,255,210,0.38)');
    grad.addColorStop(0.65,'rgba(0,220,180,0.18)');
    grad.addColorStop(1,   'rgba(0,255,200,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(screenX - pillarHW * 3, topY - 8, pillarHW * 6, beamH + 16);

    // Core beam — bright teal/white centre
    var coreGrad = ctx.createLinearGradient(screenX - pillarHW, 0, screenX + pillarHW, 0);
    coreGrad.addColorStop(0,   'rgba(0,255,200,0)');
    coreGrad.addColorStop(0.4, 'rgba(80,255,220,0.6)');
    coreGrad.addColorStop(0.5, 'rgba(200,255,245,0.9)');
    coreGrad.addColorStop(0.6, 'rgba(80,255,220,0.6)');
    coreGrad.addColorStop(1,   'rgba(0,255,200,0)');
    ctx.fillStyle = coreGrad;
    ctx.fillRect(screenX - pillarHW, topY, pillarHW * 2, beamH);

    // Bright orb at top of beam
    var orbR = Math.max(4, pillarHW * 1.4);
    var orbY = topY;
    ctx.shadowBlur = 22 * pulse; ctx.shadowColor = '#00ffcc';
    ctx.beginPath(); ctx.arc(screenX, orbY, orbR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180,255,240,0.95)'; ctx.fill();
    ctx.shadowBlur = 0;

    // Floating "CAVE" label when close enough
    if (dist < 350) {
      var labelAlpha = Math.min(1.0, (350 - dist) / 150) * alpha;
      ctx.globalAlpha = labelAlpha;
      var labelSize = Math.max(9, Math.floor(22 - dist / 22));
      ctx.font = 'bold ' + labelSize + 'px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00ffcc';
      ctx.shadowBlur = 8; ctx.shadowColor = '#00ffcc';
      ctx.fillText('CAVE', screenX, orbY - orbR - 4);
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }
}

// Cave entrance beacon — 2D top-down: pulsing teal ring with "C" label.
function drawCaveEntrance2D() {
  if (!deepCaveEntrances || !deepCaveEntrances.length) return;
  var now = Date.now();
  ctx.save(); ctx.translate(-viewCam.x, -viewCam.y);
  for (var ei = 0; ei < deepCaveEntrances.length; ei++) {
    var ce = deepCaveEntrances[ei];
    var pulse = 0.55 + 0.45 * Math.sin(now * 0.003 + ei * 1.7);
    ctx.globalAlpha = 0.7 * pulse + 0.15;
    // Outer glow ring
    ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 3;
    ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc';
    ctx.beginPath(); ctx.arc(ce.x, ce.y, 13, 0, Math.PI * 2); ctx.stroke();
    // Inner filled dot
    ctx.fillStyle = 'rgba(0,220,180,0.55)';
    ctx.beginPath(); ctx.arc(ce.x, ce.y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // Label
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('C', ce.x, ce.y + 3);
  }
  ctx.restore();
}

// Shop overlay — two-zone layout:
//   Top:    large detail card for the selected item (name, desc, cost, buy prompt)
//   Bottom: strip of 5 compact numbered tabs; A/D or ←/→ cycles selection
// No scrolling needed — everything fits at any canvas size.
function drawShopOverlay() {
  if (!shopOpen) return;
  var w = canvas.width, h = canvas.height;
  ctx.save();

  // Get dynamic item list (filters out already-bought spells/upgrades)
  var visItems = getVisibleShopItems();
  if (visItems.length === 0) visItems = SHOP_ITEMS_BASE.slice(0, 5); // fallback to consumables

  // Paging: max 6 tabs visible at a time
  var maxTabs = 6;
  var shopPage = Math.floor(shopSelIdx / maxTabs);
  var pageStart = shopPage * maxTabs;
  var pageItems = visItems.slice(pageStart, pageStart + maxTabs);
  var pageIdx = shopSelIdx - pageStart;
  // Clamp selection
  if (shopSelIdx >= visItems.length) shopSelIdx = visItems.length - 1;
  if (shopSelIdx < 0) shopSelIdx = 0;

  // ── Dim background ──────────────────────────────────────────────────
  ctx.fillStyle = 'rgba(0,0,0,0.78)'; ctx.fillRect(0, 0, w, h);

  // ── Panel bounds ────────────────────────────────────────────────────
  var panW = Math.min(440, Math.floor(w * 0.88));
  var panH = Math.min(340, Math.floor(h * 0.86));
  var px = Math.floor((w - panW) / 2), py = Math.floor((h - panH) / 2);

  // Panel background + border
  ctx.fillStyle = 'rgba(14,9,2,0.97)';
  ctx.strokeStyle = '#c8a020'; ctx.lineWidth = 2;
  ctx.fillRect(px, py, panW, panH);
  ctx.strokeRect(px, py, panW, panH);

  // Inner inset line (decorative)
  ctx.strokeStyle = 'rgba(200,160,32,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(px + 5, py + 5, panW - 10, panH - 10);

  // ── Header ──────────────────────────────────────────────────────────
  var hdY = py + 26;
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px serif'; ctx.textAlign = 'center';
  ctx.fillText('= Wandering Merchant =', px + panW / 2, hdY);
  ctx.fillStyle = '#aa9944'; ctx.font = '11px Arial';
  var pageHint = visItems.length > maxTabs ? ('  Page ' + (shopPage + 1) + '/' + Math.ceil(visItems.length / maxTabs)) : '';
  ctx.fillText('Coins: ' + coins + '   \u25C4 Tab \u25BA  select   [E] buy   [Esc] close' + pageHint, px + panW / 2, hdY + 17);

  // ── Tab strip (bottom) ──────────────────────────────────────────────
  var tabStripH = 54;
  var tabY = py + panH - tabStripH - 8;
  var tabW = Math.floor((panW - 28) / Math.max(1, pageItems.length));
  var tabPad = 4;

  for (var ti = 0; ti < pageItems.length; ti++) {
    var titem = pageItems[ti];
    var canBuyT = (coins >= titem.cost);
    var sel = (ti === pageIdx);
    var tx = px + 14 + ti * tabW;

    // Tab background — spell/upgrade tomes get different tints
    var isSpellItem = (titem.type === 'spell' || titem.type === 'upgrade');
    if (sel) {
      ctx.fillStyle = canBuyT ? (isSpellItem ? 'rgba(20,40,90,0.95)' : 'rgba(90,70,10,0.95)') : 'rgba(60,20,20,0.95)';
    } else {
      ctx.fillStyle = canBuyT ? (isSpellItem ? 'rgba(10,20,45,0.7)' : 'rgba(40,30,5,0.7)') : 'rgba(22,14,14,0.7)';
    }
    ctx.fillRect(tx, tabY, tabW - tabPad, tabStripH);

    // Tab border
    ctx.strokeStyle = sel ? (canBuyT ? '#ffd700' : '#882222') : (canBuyT ? '#665500' : '#333333');
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(tx, tabY, tabW - tabPad, tabStripH);

    // Number key
    ctx.fillStyle = sel ? '#ffffff' : (canBuyT ? '#ccaa44' : '#555555');
    ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText('' + (ti + 1), tx + (tabW - tabPad) / 2, tabY + 13);

    // Short name
    var shortName = titem.name.split(' ')[0];
    ctx.fillStyle = sel ? '#ffd700' : (canBuyT ? '#ccaa44' : '#444444');
    if (isSpellItem && titem.spellId && spells[titem.spellId]) {
      ctx.fillStyle = sel ? spells[titem.spellId].color : (canBuyT ? spells[titem.spellId].color : '#444444');
    }
    ctx.font = (sel ? 'bold ' : '') + '10px Arial';
    ctx.fillText(shortName, tx + (tabW - tabPad) / 2, tabY + 27);

    // Cost
    ctx.fillStyle = canBuyT ? '#ffdd55' : '#553333';
    ctx.font = '10px Arial';
    ctx.fillText(titem.cost + 'g', tx + (tabW - tabPad) / 2, tabY + 42);
  }

  // ── Detail card (between header and tab strip) ───────────────────────
  var cardY = py + 52, cardH = tabY - cardY - 8;
  var cardX = px + 14, cardW = panW - 28;
  var selItem = visItems[shopSelIdx] || visItems[0];
  var canBuySel = (coins >= selItem.cost);

  ctx.fillStyle = canBuySel ? 'rgba(55,42,8,0.85)' : 'rgba(35,18,18,0.85)';
  ctx.fillRect(cardX, cardY, cardW, cardH);
  ctx.strokeStyle = canBuySel ? '#aa8800' : '#552222'; ctx.lineWidth = 1.5;
  ctx.strokeRect(cardX, cardY, cardW, cardH);

  // Item icon glyph
  var icons = {heal:'\u2665', mana:'\u2726', speed:'\u27A4', ward:'\u26E8', dmg:'\u2605',
               spell_fire:'\u2622', spell_ice:'\u2744', spell_lightning:'\u26A1',
               spell_poison:'\u2623', spell_arcane:'\u2728',
               upg_missile:'\u2B06', upg_fire:'\u2B06', upg_ice:'\u2B06',
               upg_lightning:'\u2B06', upg_poison:'\u2B06', upg_arcane:'\u2B06'};
  var iconGlyph = icons[selItem.id] || '\u25C6';
  var iconSize  = Math.min(36, Math.floor(cardH * 0.45));
  // Spell items get their spell color for the icon
  var iconColor = canBuySel ? '#ffd700' : '#773333';
  if (selItem.spellId && spells[selItem.spellId] && canBuySel) iconColor = spells[selItem.spellId].color;
  ctx.fillStyle = iconColor;
  ctx.font = 'bold ' + iconSize + 'px serif'; ctx.textAlign = 'center';
  var iconX = cardX + Math.floor(cardW * 0.15);
  var midY  = cardY + cardH / 2;
  ctx.fillText(iconGlyph, iconX, midY + iconSize * 0.35);

  // Type label (small, above name)
  if (selItem.type === 'spell') {
    ctx.fillStyle = '#6688cc'; ctx.font = '9px Arial'; ctx.textAlign = 'left';
    ctx.fillText('SPELL TOME', cardX + Math.floor(cardW * 0.28), midY - Math.floor(cardH * 0.25));
  } else if (selItem.type === 'upgrade') {
    ctx.fillStyle = '#cc8844'; ctx.font = '9px Arial'; ctx.textAlign = 'left';
    ctx.fillText('UPGRADE', cardX + Math.floor(cardW * 0.28), midY - Math.floor(cardH * 0.25));
  }

  // Name
  var textX = cardX + Math.floor(cardW * 0.28);
  ctx.fillStyle = canBuySel ? '#ffd700' : '#884444';
  ctx.font = 'bold ' + Math.min(16, Math.floor(cardH * 0.22)) + 'px serif';
  ctx.textAlign = 'left';
  ctx.fillText(selItem.name, textX, midY - Math.floor(cardH * 0.08));

  // Description
  ctx.fillStyle = canBuySel ? '#ddddcc' : '#665555';
  ctx.font = Math.min(13, Math.floor(cardH * 0.17)) + 'px Arial';
  ctx.fillText(selItem.desc, textX, midY + Math.floor(cardH * 0.12));

  // Cost badge
  var badgeX = cardX + cardW - 12, badgeY = cardY + 12;
  ctx.fillStyle = canBuySel ? '#ffd700' : '#553333';
  ctx.font = 'bold ' + Math.min(15, Math.floor(cardH * 0.20)) + 'px Arial';
  ctx.textAlign = 'right';
  ctx.fillText(selItem.cost + 'g', badgeX, badgeY + Math.floor(cardH * 0.20));

  // Buy prompt
  ctx.fillStyle = canBuySel ? 'rgba(100,255,100,0.90)' : 'rgba(180,60,60,0.80)';
  ctx.font = 'bold ' + Math.min(12, Math.floor(cardH * 0.15)) + 'px Arial';
  ctx.textAlign = 'center';
  var promptY = cardY + cardH - 10;
  ctx.fillText(canBuySel ? '[E] Buy' : 'Need ' + (selItem.cost - coins) + ' more coins', cardX + cardW / 2, promptY);

  ctx.restore();
}

// ── Minimap ───────────────────────────────────────────────────────────
var MINIMAP_W = 90, MINIMAP_H = 65;

function initMinimap() {
  if (!grid || gridW < 2 || gridH < 2) return;
  exploredCells = new Uint8Array(gridW * gridH);
  minimapDirty = true;
  // Create offscreen canvas for terrain base
  minimapCanvas = document.createElement('canvas');
  minimapCanvas.width = MINIMAP_W;
  minimapCanvas.height = MINIMAP_H;
  renderMinimapBase();
}

function renderMinimapBase() {
  if (!minimapCanvas || !grid) return;
  var mc = minimapCanvas.getContext('2d');
  mc.fillStyle = '#000000';
  mc.fillRect(0, 0, MINIMAP_W, MINIMAP_H);
  var scaleX = MINIMAP_W / gridW;
  var scaleY = MINIMAP_H / gridH;
  // Terrain-specific floor color
  var floorCol, wallCol;
  if (terrain === 'ice')         { floorCol = '#1a2535'; wallCol = '#3a4a60'; }
  else if (terrain === 'cave')   { floorCol = '#1a1818'; wallCol = '#3a3535'; }
  else if (terrain === 'expanse'){ floorCol = '#1e1508'; wallCol = '#3a2a15'; }
  else if (terrain === 'plains') { floorCol = '#1a1a0e'; wallCol = '#35351a'; }
  else                           { floorCol = '#1a1510'; wallCol = '#3a3025'; }
  for (var gy = 0; gy < gridH; gy++) {
    for (var gx = 0; gx < gridW; gx++) {
      var px = Math.floor(gx * scaleX);
      var py = Math.floor(gy * scaleY);
      var pw = Math.max(1, Math.ceil(scaleX));
      var ph = Math.max(1, Math.ceil(scaleY));
      if (grid[gy * gridW + gx] === 1) {
        mc.fillStyle = wallCol;
      } else {
        mc.fillStyle = floorCol;
      }
      mc.fillRect(px, py, pw, ph);
    }
  }
}

function updateExplored() {
  if (!exploredCells || !grid || !pos) return;
  var pgx = Math.floor(pos.x / cell);
  var pgy = Math.floor(pos.y / cell);
  var reveal = 7; // reveal radius in grid cells
  var changed = false;
  for (var dy = -reveal; dy <= reveal; dy++) {
    for (var dx = -reveal; dx <= reveal; dx++) {
      if (dx * dx + dy * dy > reveal * reveal) continue;
      var gx = pgx + dx, gy = pgy + dy;
      if (gx < 0 || gy < 0 || gx >= gridW || gy >= gridH) continue;
      var idx = gy * gridW + gx;
      if (!exploredCells[idx]) { exploredCells[idx] = 1; changed = true; }
    }
  }
  if (changed) minimapDirty = true;
}

function drawMinimap() {
  if (!minimapVisible || !exploredCells || !minimapCanvas || !grid) return;
  var w = canvas.width, h = canvas.height;
  var pad = 10;
  // Position: top-left corner
  var mmX = pad;
  var mmY = pad;

  ctx.save();
  ctx.globalAlpha = 0.85;

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(mmX - 1, mmY - 1, MINIMAP_W + 2, MINIMAP_H + 2);

  // Composite: draw terrain base, then punch out fog for explored areas
  // Use a second offscreen canvas for the fog mask, updated only when dirty
  if (!drawMinimap._fogCanvas) {
    drawMinimap._fogCanvas = document.createElement('canvas');
    drawMinimap._fogCanvas.width = MINIMAP_W;
    drawMinimap._fogCanvas.height = MINIMAP_H;
    minimapDirty = true;
  }
  if (minimapDirty) {
    var fc = drawMinimap._fogCanvas.getContext('2d');
    // Start fully black (fog), then clear explored pixels to transparent
    fc.fillStyle = 'rgba(0,0,0,0.88)';
    fc.fillRect(0, 0, MINIMAP_W, MINIMAP_H);
    fc.globalCompositeOperation = 'destination-out';
    fc.fillStyle = 'rgba(0,0,0,1)';
    var scaleX = MINIMAP_W / gridW;
    var scaleY = MINIMAP_H / gridH;
    for (var gy = 0; gy < gridH; gy++) {
      for (var gx = 0; gx < gridW; gx++) {
        if (exploredCells[gy * gridW + gx]) {
          fc.fillRect(Math.floor(gx * scaleX), Math.floor(gy * scaleY),
                      Math.max(1, Math.ceil(scaleX)), Math.max(1, Math.ceil(scaleY)));
        }
      }
    }
    fc.globalCompositeOperation = 'source-over';
    minimapDirty = false;
  }

  // Draw terrain base then fog overlay
  ctx.drawImage(minimapCanvas, mmX, mmY);
  ctx.drawImage(drawMinimap._fogCanvas, mmX, mmY);

  // Markers
  ctx.globalAlpha = 1.0;
  var toMmX = function(wx) { return mmX + (wx / worldW) * MINIMAP_W; };
  var toMmY = function(wy) { return mmY + (wy / worldH) * MINIMAP_H; };

  // Goal marker (green)
  if (goalSpawned && goal) {
    ctx.fillStyle = '#44ff44';
    var gx2 = toMmX(goal.x + (goal.w || 0) * 0.5);
    var gy2 = toMmY(goal.y + (goal.h || 0) * 0.5);
    ctx.fillRect(gx2 - 2, gy2 - 2, 4, 4);
  }

  // Shop marker (yellow)
  if (shopMarker) {
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(toMmX(shopMarker.x) - 1.5, toMmY(shopMarker.y) - 1.5, 3, 3);
  }

  // Cave entrances (cyan)
  if (deepCaveEntrances) {
    ctx.fillStyle = '#00ffcc';
    for (var ci = 0; ci < deepCaveEntrances.length; ci++) {
      var ce = deepCaveEntrances[ci];
      ctx.fillRect(toMmX(ce.x) - 1.5, toMmY(ce.y) - 1.5, 3, 3);
    }
  }

  // Player (white dot + direction line)
  if (pos) {
    var pmx = toMmX(pos.x), pmy = toMmY(pos.y);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(pmx, pmy, 2, 0, Math.PI * 2); ctx.fill();
    // Direction indicator
    var dirLen = 5;
    var ang = cam ? cam.ang : 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pmx, pmy);
    ctx.lineTo(pmx + Math.cos(ang) * dirLen, pmy + Math.sin(ang) * dirLen);
    ctx.stroke();
  }

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(mmX - 1, mmY - 1, MINIMAP_W + 2, MINIMAP_H + 2);

  ctx.restore();
}

function drawHudOverlay() {
  var w = canvas.width, h = canvas.height;
  ctx.save();
  var pad = 10;
  var barW = Math.min(120, Math.floor(w * 0.2)), barH = 8;

  // ── Health bar — top-left, right of minimap ──
  var barX = pad + MINIMAP_W + 8;
  var hy = pad + 4;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(barX - 2, hy - 2, barW + 4, barH + 4);
  var hpct = Math.max(0, Math.min(1, health / HEALTH_MAX));
  ctx.fillStyle = '#ff6a6a';
  ctx.fillRect(barX, hy, Math.floor(barW * hpct), barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, hy, barW, barH);

  // ── Coin counter — right of health bar ──
  if (coins > 0 || (shopMarker && shopNearby)) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left';
    ctx.fillText('$ ' + coins, barX + barW + 8, hy + barH - 1);
  }

  // ── Mana bar — below health ──
  var my = hy + barH + 6;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(barX - 2, my - 2, barW + 4, barH + 4);
  var pct = Math.max(0, Math.min(1, mana / MANA_MAX));
  var blink = (Date.now() < manaBlinkUntil);
  if (blink) {
    var a = 0.5 + 0.5 * Math.sin(Date.now() / 120);
    ctx.fillStyle = 'rgba(255,64,64,' + a.toFixed(2) + ')';
  } else {
    ctx.fillStyle = '#4db6ff';
  }
  ctx.fillRect(barX, my, Math.floor(barW * pct), barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, my, barW, barH);

  // ── Shop prompt — centered ──
  if (shopNearby && !shopOpen) {
    ctx.globalAlpha = 0.9 + 0.1 * Math.sin(Date.now() * 0.006);
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
    ctx.fillText('[E]  Enter Shop', w / 2, h / 2 + 40);
  }

  // ── Spell indicator — bottom-right, fades after change ──
  var spellAge = (Date.now() - lastSpellChangeMs) / 1000;
  if (spellAge < 3) {
    var spell = getCurrentSpell();
    ctx.font = '12px Arial';
    var spellTxtW = ctx.measureText(spell.name).width;
    var dotR = 7, dotGap = 6, innerPad = 6;
    var boxW = innerPad + dotR * 2 + dotGap + spellTxtW + innerPad;
    var boxH = 28;
    var sx = w - pad - boxW, sy = h - pad - boxH - 4;
    var spellAlpha = spellAge < 2 ? 0.88 : 0.88 * (1.0 - (spellAge - 2));
    ctx.globalAlpha = spellAlpha;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(sx, sy, boxW, boxH);
    ctx.fillStyle = spell.color;
    ctx.beginPath(); ctx.arc(sx + innerPad + dotR, sy + boxH / 2, dotR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left';
    ctx.fillText(spell.name, sx + innerPad + dotR * 2 + dotGap, sy + boxH / 2 + 4);
  }

  // ── Fullscreen hint — bottom-right, fades out after 8 s ──
  var hintAge = (Date.now() - startMs) / 1000;
  if (hintAge < 8) {
    var hintAlpha = Math.max(0, 1.0 - (hintAge - 6) / 2);
    ctx.globalAlpha = hintAlpha * 0.7;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(w - 110, h - 58, 106, 20);
    ctx.fillStyle = '#aaaaaa';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('[F] Fullscreen', w - 57, h - 44);
  }


  // ── Goal spawn message — fades out ──
  if (goalMessage && Date.now() < goalMessageUntil) {
    var msgAge = goalMessageUntil - Date.now();
    var alpha = msgAge < 1000 ? msgAge / 1000 : 1.0;
    ctx.globalAlpha = alpha * 0.95;
    var gmW = 320, gmH = 36;
    var gmX = Math.floor((w - gmW) / 2), gmY = Math.floor(h * 0.35);
    ctx.fillStyle = 'rgba(0,30,0,0.75)';
    ctx.fillRect(gmX, gmY, gmW, gmH);
    ctx.strokeStyle = '#44ff66';
    ctx.lineWidth = 2;
    ctx.strokeRect(gmX, gmY, gmW, gmH);
    ctx.fillStyle = '#44ff66';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(goalMessage, w / 2, gmY + 24);
    ctx.textAlign = 'left';
  }

  // ── Equipment slots — aligned with bottom of minimap ──
  var eqSlotSize = 16, eqGap = 3;
  var eqX = pad + MINIMAP_W + 8;
  var eqY = pad + MINIMAP_H - eqSlotSize;
  var slots = ['armor', 'hat', 'robes'];
  var slotIcons = {armor: 'A', hat: 'H', robes: 'R'};
  for (var eqi = 0; eqi < 3; eqi++) {
    var slotX = eqX + eqi * (eqSlotSize + eqGap);
    var eqItem = equipment[slots[eqi]];
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = eqItem ? 'rgba(20,20,40,0.7)' : 'rgba(0,0,0,0.3)';
    ctx.fillRect(slotX, eqY, eqSlotSize, eqSlotSize);
    if (eqItem) {
      ctx.strokeStyle = RARITY_COLORS[eqItem.rarity] || '#888';
      ctx.lineWidth = 2;
      ctx.strokeRect(slotX, eqY, eqSlotSize, eqSlotSize);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
      ctx.fillText(slotIcons[slots[eqi]], slotX + eqSlotSize/2, eqY + eqSlotSize - 3);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
      ctx.strokeRect(slotX, eqY, eqSlotSize, eqSlotSize);
    }
  }

  // Inventory overlay (I key toggle)
  if (inventoryOpen) drawInventoryOverlay();

  // Minimap
  drawMinimap();

  ctx.restore();
}

function drawInventoryOverlay() {
  var w = canvas.width, h = canvas.height;
  var panW = Math.min(340, w * 0.7), panH = Math.min(280, h * 0.65);
  var px = Math.floor((w - panW) / 2), py = Math.floor((h - panH) / 2);

  ctx.globalAlpha = 0.92;
  ctx.fillStyle = 'rgba(10,10,25,0.92)';
  ctx.fillRect(px, py, panW, panH);
  ctx.strokeStyle = 'rgba(100,150,255,0.7)'; ctx.lineWidth = 2;
  ctx.strokeRect(px, py, panW, panH);

  // Title
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Equipment  [I to close]', px + panW / 2, py + 22);

  // Slot entries
  var slotNames = ['armor', 'hat', 'robes'];
  var slotLabels = ['Armor', 'Hat', 'Robes'];
  var ly = py + 45;
  var slotH = 60;

  for (var si = 0; si < 3; si++) {
    var slotItem = equipment[slotNames[si]];
    var slotY = ly + si * slotH;

    // Slot background
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = slotItem ? 'rgba(30,30,60,0.8)' : 'rgba(20,20,30,0.5)';
    ctx.fillRect(px + 12, slotY, panW - 24, slotH - 6);

    // Slot label
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#8888aa'; ctx.font = '11px Arial'; ctx.textAlign = 'left';
    ctx.fillText(slotLabels[si], px + 18, slotY + 15);

    if (slotItem) {
      // Rarity-colored border
      ctx.strokeStyle = RARITY_COLORS[slotItem.rarity] || '#888';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 12, slotY, panW - 24, slotH - 6);

      // Item name
      ctx.fillStyle = RARITY_COLORS[slotItem.rarity] || '#fff';
      ctx.font = 'bold 13px Arial'; ctx.textAlign = 'left';
      ctx.fillText(slotItem.name, px + 18, slotY + 32);

      // Description
      ctx.fillStyle = '#bbbbbb'; ctx.font = '11px Arial';
      ctx.fillText(slotItem.desc, px + 18, slotY + 47);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
      ctx.strokeRect(px + 12, slotY, panW - 24, slotH - 6);
      ctx.fillStyle = '#555555'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
      ctx.fillText('Empty', px + 18, slotY + 32);
    }
  }

  // Stats summary
  var statY = ly + 3 * slotH + 10;
  ctx.fillStyle = '#aaaacc'; ctx.font = '11px Arial'; ctx.textAlign = 'left';
  var statLines = [];
  if (equipment.armor) statLines.push('-' + Math.round(equipment.armor.damageReduction * 100) + '% damage taken');
  if (equipment.hat && equipment.hat.manaRegen) statLines.push('+' + equipment.hat.manaRegen + ' mana/s');
  if (equipment.hat && equipment.hat.hpRegen) statLines.push('+' + equipment.hat.hpRegen + ' HP/s');
  if (equipment.hat && equipment.hat.speedBonus) statLines.push('+' + Math.round(equipment.hat.speedBonus * 100) + '% speed');
  if (equipment.robes && equipment.robes.spellDmgBonus) statLines.push('+' + Math.round(equipment.robes.spellDmgBonus * 100) + '% spell damage');
  if (equipment.robes && equipment.robes.manaCostReduction) statLines.push('-' + Math.round(equipment.robes.manaCostReduction * 100) + '% mana cost');
  if (statLines.length > 0) {
    ctx.fillStyle = '#88cc88';
    ctx.fillText('Active bonuses: ' + statLines.join(', '), px + 18, statY);
  } else {
    ctx.fillStyle = '#666666';
    ctx.fillText('No equipment bonuses active', px + 18, statY);
  }
}

function drawMenuOverlay() {
  if (!menuOpen) return;
  var w = canvas.width, h = canvas.height;
  ctx.save(); ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, w, h);
  var menuW = Math.min(400, w * 0.6), menuH = Math.min(300, h * 0.6);
  var mx = (w - menuW) / 2, my = (h - menuH) / 2;
  ctx.fillStyle = 'rgba(20,20,40,0.95)'; ctx.strokeStyle = 'rgba(100,150,255,0.8)'; ctx.lineWidth = 2;
  ctx.fillRect(mx, my, menuW, menuH); ctx.strokeRect(mx, my, menuW, menuH);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Player Stats', mx + menuW / 2, my + 30);
  ctx.font = '16px Arial'; ctx.textAlign = 'left';
  var lineY = my + 60, lineH = 24, leftX = mx + 20;
  ctx.fillStyle = '#aaddff'; ctx.fillText('Mana:', leftX, lineY);
  ctx.fillStyle = '#ffffff';
  var manaPct = ((mana / MANA_MAX) * 100).toFixed(0);
  ctx.fillText(Math.floor(mana) + ' / ' + MANA_MAX + ' (' + manaPct + '%)', leftX + 120, lineY);
  lineY += lineH;
  ctx.fillStyle = '#aaddff'; ctx.fillText('Health:', leftX, lineY);
  ctx.fillStyle = '#ffffff';
  var hpPct = ((health / HEALTH_MAX) * 100).toFixed(0);
  ctx.fillText(Math.floor(health) + ' / ' + HEALTH_MAX + ' (' + hpPct + '%)', leftX + 120, lineY);
  lineY += lineH;
  ctx.fillStyle = '#aaddff'; ctx.fillText('Level:', leftX, lineY);
  ctx.fillStyle = '#ffffff'; ctx.fillText(level.toString(), leftX + 120, lineY);
  lineY += lineH;
  ctx.fillStyle = '#aaddff'; ctx.fillText('Enemies Defeated:', leftX, lineY);
  ctx.fillStyle = '#ffffff'; ctx.fillText(stats.totalEnemiesKilled.toString(), leftX + 120, lineY);
  lineY += lineH + 10;
  var barW2 = menuW - 40, barH2 = 20;
  var barX = mx + 20, barY = lineY;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW2, barH2);
  var manaPct2 = Math.max(0, Math.min(1, mana / MANA_MAX));
  ctx.fillStyle = '#4db6ff'; ctx.fillRect(barX, barY, Math.floor(barW2 * manaPct2), barH2);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW2, barH2);
  ctx.fillStyle = '#ffffff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Mana', barX + barW2 / 2, barY + 14);
  ctx.font = '14px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffdd88';
  ctx.fillText('Press Start to close', mx + menuW / 2, my + menuH - 20);
  ctx.restore();
}


function drawGameOver() {
  var w = canvas.width, h = canvas.height;
  ctx.save();

  // Dimmed background
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, w, h);

  // Layout constants — panel is sized to fit content, never by canvas height
  var titleH  = 46;  // baseline of title text from panel top
  var dividerY = titleH + 12;
  var statsTop = dividerY + 24;
  var statRows = ['Level reached:', 'Enemies defeated:', 'Damage taken:', 'Time survived:'];
  var statLH   = 26;
  var statsH   = statRows.length * statLH;
  var hintH    = 36;  // space for the "press start" line + bottom padding
  var padTop   = 16;  // extra top padding above title

  var panW = Math.min(300, w - 16);
  var panH = padTop + statsTop + statsH + hintH;
  var px = Math.floor((w - panW) / 2);
  var py = Math.floor((h - panH) / 2);

  // Panel background + border
  ctx.fillStyle = 'rgba(40,0,0,0.96)';
  ctx.strokeStyle = '#cc2222'; ctx.lineWidth = 2;
  ctx.fillRect(px, py, panW, panH);
  ctx.strokeRect(px, py, panW, panH);

  // Title
  ctx.textAlign = 'center'; ctx.fillStyle = '#ff3333';
  ctx.font = 'bold ' + Math.max(20, Math.min(28, Math.floor(panW * 0.09))) + 'px Arial';
  ctx.fillText('GAME OVER', px + panW / 2, py + padTop + titleH);

  // Divider
  ctx.strokeStyle = '#661111'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 16, py + padTop + dividerY);
  ctx.lineTo(px + panW - 16, py + padTop + dividerY);
  ctx.stroke();

  // Stats — label on left, value right-aligned
  ctx.font = '13px Arial'; ctx.textAlign = 'left';
  var lx  = px + 18, rx = px + panW - 18;
  var ly  = py + padTop + statsTop;
  var statValues = [
    level.toString(),
    (stats.totalEnemiesKilled || 0).toString(),
    Math.floor(stats.totalDamageTaken || 0).toString(),
    timeSec.toFixed(1) + 's'
  ];
  for (var si = 0; si < statRows.length; si++) {
    ctx.fillStyle = '#ffaaaa'; ctx.textAlign = 'left';
    ctx.fillText(statRows[si], lx, ly);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'right';
    ctx.fillText(statValues[si], rx, ly);
    ly += statLH;
  }

  // Restart hint — always sits in reserved space below stats
  ctx.textAlign = 'center'; ctx.font = '12px Arial'; ctx.fillStyle = '#ff7777';
  ctx.fillText('Press Start to play again', px + panW / 2, py + panH - 12);

  ctx.restore();
}

// Top-down tiny icons for floor scatter items — called inside draw2D's translate block.
function drawFloorScatter2D() {
  if (!floorScatter || !floorScatter.length) return;
  ctx.save();
  for (var i = 0; i < floorScatter.length; i++) {
    var item = floorScatter[i];

    ctx.globalAlpha = 0.72;
    if (t === 'bones' || t === 'dry_bones') {
      ctx.strokeStyle = (t === 'dry_bones') ? '#c0a850' : '#aaaaaa';
      ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x-4, y-2); ctx.lineTo(x+4, y+2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+3, y-3); ctx.lineTo(x-3, y+3); ctx.stroke();
    } else if (t === 'crate') {
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(x-3, y-3, 6, 6);

    } else if (t === 'skull') {

      ctx.fillStyle = (t === 'desert_rock') ? '#c8a070' : '#888070';

      ctx.beginPath(); ctx.moveTo(x, y-1); ctx.lineTo(x-3, y-3); ctx.stroke();

      ctx.fillStyle = 'rgba(180,220,255,0.35)';
      ctx.beginPath(); ctx.ellipse(x, y, 4, 2, 0, 0, Math.PI*2); ctx.fill();
    } else if (t === 'frozen_skull') {
      ctx.fillStyle = 'rgba(140,200,255,0.4)'; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#b8b0a0'; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
    } else if (t === 'tall_grass') {
      ctx.strokeStyle = '#5a7a3a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x-2, y+2); ctx.lineTo(x-1, y-3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y+2); ctx.lineTo(x+1, y-4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+2, y+2); ctx.lineTo(x+3, y-3); ctx.stroke();
    } else if (t === 'wildflower') {

    } else if (t === 'stone_marker') {

    } else if (t === 'barrel') {

      ctx.strokeStyle = '#555'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.stroke();
    } else if (t === 'bookshelf_debris') {
      ctx.fillStyle = '#5a3e20'; ctx.fillRect(x-3, y-1, 6, 2);

    } else if (t === 'stone_column' || t === 'rock_spire') {

// Tiny top-down icons for wall decorations — called inside draw2D's translate block.

    } else if (t === 'fungi') {

    } else if (t === 'stalactite_tip') {

    } else if (t === 'icicle') {

// =============================================
// DEBUG OVERVIEW — full zoomed-out map render
// =============================================
var overviewActive = false;

function drawDebugOverview() {
  if (!grid || !gridW) return;
  var cw = canvas.width, ch = canvas.height;
  var scaleX = cw / worldW, scaleY = ch / worldH;
  var scale = Math.min(scaleX, scaleY) * 0.97;
  var offX = (cw - worldW * scale) * 0.5;
  var offY = (ch - worldH * scale) * 0.5;

  function wx(x) { return offX + x * scale; }
  function wy(y) { return offY + y * scale; }
  function ws(s) { return Math.max(1, s * scale); }

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, cw, ch);

  // --- 1. Grid cells: wall vs floor ---
  var cellS = ws(cell);
  for (var gy = 0; gy < gridH; gy++) {
    for (var gx = 0; gx < gridW; gx++) {
      var isWall = grid[gy * gridW + gx];
      if (isWall) {
        ctx.fillStyle = '#2a2030';
      } else {
        ctx.fillStyle = '#4a3c28';
      }
      ctx.fillRect(wx(gx * cell), wy(gy * cell), Math.max(1, cellS), Math.max(1, cellS));
    }
  }

  // --- 2. Border polygon (playable boundary) ---
  if (currentBorderPoly && currentBorderPoly.length > 2) {
    ctx.save();
    ctx.strokeStyle = '#88aaff';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(wx(currentBorderPoly[0].x), wy(currentBorderPoly[0].y));
    for (var pi = 1; pi < currentBorderPoly.length; pi++) {
      ctx.lineTo(wx(currentBorderPoly[pi].x), wy(currentBorderPoly[pi].y));
    }
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // --- 3. Deep cave regions (corridors + chambers) ---
  if (deepCaveRegions && deepCaveRegions.length) {
    for (var ci = 0; ci < deepCaveRegions.length; ci++) {
      var cr = deepCaveRegions[ci];
      var isChamber = cr.type === 'chamber';
      var dx = cr.x2 - cr.x1, dy = cr.y2 - cr.y1;
      var len = Math.hypot(dx, dy) || 1;
      var perpX = -dy / len, perpY = dx / len;
      var hw = ws(cr.width * 0.5);
      ctx.beginPath();
      ctx.moveTo(wx(cr.x1 + perpX * cr.width * 0.5), wy(cr.y1 + perpY * cr.width * 0.5));
      ctx.lineTo(wx(cr.x2 + perpX * cr.width * 0.5), wy(cr.y2 + perpY * cr.width * 0.5));
      ctx.lineTo(wx(cr.x2 - perpX * cr.width * 0.5), wy(cr.y2 - perpY * cr.width * 0.5));
      ctx.lineTo(wx(cr.x1 - perpX * cr.width * 0.5), wy(cr.y1 - perpY * cr.width * 0.5));
      ctx.closePath();
      ctx.fillStyle = isChamber ? 'rgba(120,60,200,0.55)' : 'rgba(60,120,200,0.45)';
      ctx.fill();
      ctx.strokeStyle = isChamber ? '#cc88ff' : '#44aaff';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // --- 4. Cave chambers (circle overlays) ---
  if (deepCaveChambers && deepCaveChambers.length) {
    for (var chi = 0; chi < deepCaveChambers.length; chi++) {
      var ch2 = deepCaveChambers[chi];
      ctx.beginPath();
      ctx.arc(wx(ch2.cx), wy(ch2.cy), ws(ch2.radius), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(160,80,255,0.3)';
      ctx.fill();
      ctx.strokeStyle = '#cc44ff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // --- 5. Ore veins ---
  if (oreVeins && oreVeins.length) {
    for (var oi = 0; oi < oreVeins.length; oi++) {
      var ov = oreVeins[oi];
      ctx.beginPath();
      ctx.arc(wx(ov.worldX || ov.x), wy(ov.worldY || ov.y), Math.max(2, ws(12)), 0, Math.PI * 2);
      ctx.fillStyle = ov.veinType === 'teal' ? '#44ffcc' : '#ffcc44';
      ctx.globalAlpha = 0.7;
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // --- 5b. Treasure chests ---
  if (treasureChests && treasureChests.length) {
    for (var tci = 0; tci < treasureChests.length; tci++) {
      var tc = treasureChests[tci];
      if (tc.collected) continue;
      var tcx = wx(tc.x), tcy = wy(tc.y);
      // Glow halo
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(tcx, tcy, 8, 0, Math.PI * 2); ctx.fill();
      // Chest icon — larger gold dot with dark outline
      ctx.globalAlpha = 1.0;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(tcx, tcy, 4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8b5e2b';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // --- 5c. Enemy spawners ---
  if (enemySpawners && enemySpawners.length) {
    for (var esi2 = 0; esi2 < enemySpawners.length; esi2++) {
      var es = enemySpawners[esi2];
      if (!es.active) continue;
      var esx = wx(es.x), esy = wy(es.y);
      // Red glow
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ff2244';
      ctx.beginPath(); ctx.arc(esx, esy, 10, 0, Math.PI * 2); ctx.fill();
      // Diamond shape
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = '#cc2244';
      ctx.beginPath();
      ctx.moveTo(esx, esy - 7);
      ctx.lineTo(esx + 5, esy);
      ctx.lineTo(esx, esy + 7);
      ctx.lineTo(esx - 5, esy);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ff4466';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }
  }

  // --- 6. Cave entrances ---
  if (deepCaveEntrances && deepCaveEntrances.length) {
    for (var ei = 0; ei < deepCaveEntrances.length; ei++) {
      var ent = deepCaveEntrances[ei];
      var ex2 = wx(ent.x), ey2 = wy(ent.y);
      ctx.beginPath();
      ctx.arc(ex2, ey2, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#00ffcc';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('CAVE', ex2 + 9, ey2 + 4);
    }
  }

  // --- 7. Goal ---
  if (goal) {
    ctx.fillStyle = '#00ff44';
    ctx.fillRect(wx(goal.x), wy(goal.y), Math.max(4, ws(goal.w)), Math.max(4, ws(goal.h)));
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(wx(goal.x), wy(goal.y), Math.max(4, ws(goal.w)), Math.max(4, ws(goal.h)));
  }

  // --- 8. Enemies ---
  if (enemies && enemies.length) {
    ctx.fillStyle = '#ff4444';
    for (var ei2 = 0; ei2 < enemies.length; ei2++) {
      var en = enemies[ei2];
      ctx.beginPath();
      ctx.arc(wx(en.x), wy(en.y), Math.max(2, ws(8)), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- 9. Player ---
  var px = wx(pos.x), py = wy(pos.y);
  ctx.beginPath();
  ctx.arc(px, py, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#ff0000';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Facing direction arrow
  var arrowLen = 14;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(cam.ang) * arrowLen, py + Math.sin(cam.ang) * arrowLen);
  ctx.strokeStyle = '#ff0000';
  ctx.lineWidth = 2;
  ctx.stroke();

  // --- 10. Stats panel ---
  // Geometry counts
  var _meshVerts = floorMesh ? (floorMesh.w * floorMesh.h) : 0;
  var _meshQuads = floorMesh ? ((floorMesh.w - 1) * (floorMesh.h - 1)) : 0;
  var _meshEdges = floorMesh ? (_meshQuads * 4) : 0;  // 4 edges per quad (shared)
  var _gridCells = gridW * gridH;

  var _corridorSegs = deepCaveRegions ? deepCaveRegions.filter(function(r){return r.type==='corridor';}).length : 0;
  var _chamberSegs = deepCaveRegions ? deepCaveRegions.filter(function(r){return r.type==='chamber';}).length : 0;

    'GRID: ' + gridW + 'x' + gridH + ' (' + _gridCells + ' cells, ' + _wallCells + ' walls)',

    {color:'#cc44ff', label:'Cave chamber'},
    {color:'#ffcc44', label:'Ore vein'},
    {color:'#ffd700', label:'Treasure chest'},
    {color:'#cc2244', label:'Enemy spawner'},
    {color:'#00ffcc', label:'Cave entrance'},
    {color:'#00ff44', label:'Goal'},
    {color:'#ff4444', label:'Enemy'},
    {color:'#ffffff', label:'Player'},
  ];

  var panelX = 8, panelY = 8, lineH = 16, panelW = 360, padY = 8;
  var totalH = padY * 2 + stats.length * lineH + 8 + legend.length * lineH;
  ctx.fillStyle = 'rgba(0,0,0,0.78)';

  ctx.font = '12px monospace';
  for (var si = 0; si < stats.length; si++) {

}

var _overviewPrevW = 0, _overviewPrevH = 0;

function toggleOverview() {

function draw2D() {
  updateViewCamera();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (bgPattern) {
    ctx.save(); ctx.fillStyle = bgPattern; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
  }
  ctx.save(); ctx.translate(-viewCam.x, -viewCam.y);

  // Walls
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    ctx.fillStyle = wallColor;
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }
  // Draw irregular border outline for plains/cave terrain
  drawIrregularBorder2D();

  // Goal
  if (goal) {
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  }

  // Player
  ctx.fillStyle = '#ff0000';
  ctx.beginPath(); ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2); ctx.fill();

  // Enemies — skeleton sprites, head rotated to face player
  var now = Date.now();
  for (var j = 0; j < enemies.length; j++) {
    var e = enemies[j]; var eType = e.enemyType;
    var r = 8 * eType.size; // used for status rings and health bar offset
    var hpPct2d = e.health / e.maxHealth;
    var isFlashing2d = (e.damageFlash && now < e.damageFlash);
    var msPerFrame2d = Math.max(50, 200 - eType.speed * 2);
    var skelFrameIdx2d = Math.floor(now / msPerFrame2d) % SKEL_FRAMES;
    var skelKey2d = (hpPct2d < 0.25) ? (eType.id + '_crumble') : eType.id;
    var skelCanvas2d = skeletonFrames && skeletonFrames[skelKey2d] && skeletonFrames[skelKey2d][skelFrameIdx2d];
    var sw2d = r * 2.8, sh2d = sw2d * (SKEL_H / SKEL_W);
    ctx.save();
    if (skelCanvas2d) {
      ctx.drawImage(skelCanvas2d, e.x - sw2d / 2, e.y - sh2d / 2, sw2d, sh2d);
      if (isFlashing2d) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = e.damageFlashColor || '#ffffff';
        ctx.fillRect(e.x - sw2d / 2, e.y - sh2d / 2, sw2d, sh2d);
        ctx.globalAlpha = 1.0;
      }
    } else {
      // Fallback circle if sprites not ready
      ctx.fillStyle = isFlashing2d ? (e.damageFlashColor || '#ffffff') : eType.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // Status rings (drawn in world space, no rotation)
    if (e.slowUntil && now < e.slowUntil) {
      ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r + 2, 0, Math.PI * 2); ctx.stroke();
    }
    if (e.burnUntil && now < e.burnUntil) {
      ctx.fillStyle = 'rgba(255,100,0,0.6)';
      ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.4, 0, Math.PI * 2); ctx.fill();
    }
    // Health bar
    ctx.fillStyle = (hpPct2d > 0.6) ? '#00ff00' : (hpPct2d > 0.3) ? '#ffaa00' : '#ff4444';
    ctx.fillRect(e.x - 10, e.y - 15 - r, 20 * hpPct2d, 3);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(e.x - 10, e.y - 15 - r, 20, 3);
  }

  // Death effects — bone scatter (tumbling line segments with physics)
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (var d = 0; d < deathEffects.length; d++) {
    var de = deathEffects[d];
    var t = Math.max(0, Math.min(1, (now - de.spawnMs) / de.lifeMs));
    ctx.globalAlpha = 1.0 - t * t;
    ctx.strokeStyle = de.color;
    ctx.save();
    ctx.translate(de.x, de.y);
    ctx.rotate(de.rot + de.rotVel * t);
    ctx.beginPath(); ctx.moveTo(-de.len / 2, 0); ctx.lineTo(de.len / 2, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1.0;

  // Floor scatter items and wall decorations — drawn in world space, inside translate
  drawFloorScatter2D();
  drawWallDecorations2D();

  ctx.restore();

  // Timer overlay
  ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
  ctx.fillText('Time: ' + timeSec.toFixed(1) + 's', 10, 20);
  ctx.fillStyle = timeColor;
  ctx.fillText('\u25cf', 90, 20);

}

function draw() {
  if (calibrating) { drawCalibration(); return; }

  if (MODE3D) {
    var now = Date.now();

    // Gyro aim camera smoothing
    if (CONTROL_MODE === MODE_GYRO_AIM && USE_YAW && hasYaw) {
      var effTarget = yawTarget + yawOffset;
      if (capturingYaw) {
        if (!isFinite(camHold)) camHold = cam.ang;
        cam.ang = camHold;
        if (DEBUG_CAM && now - __camDbgLast > 300) {
          __camDbgLast = now;
          try { console.log('[CAM]', 'capturing=1', 'camHold=', camHold.toFixed(3), 'yawTarget=', yawTarget.toFixed ? yawTarget.toFixed(3) : yawTarget, 'yawOffset=', yawOffset.toFixed ? yawOffset.toFixed(3) : yawOffset); } catch (_) {}
        }
      } else {
        var d = angNorm(effTarget - cam.ang);
        var alpha = (now < yawResumeUntil) ? Math.min(0.5, yawAlpha * 2.0) : yawAlpha;
        cam.ang += d * alpha;
        camHold = cam.ang;
        if (DEBUG_CAM && now - __camDbgLast > 300) {
          __camDbgLast = now;
          try { console.log('[CAM]', 'capturing=0', 'effTarget=', effTarget.toFixed ? effTarget.toFixed(3) : effTarget, 'cam=', cam.ang.toFixed(3), 'd=', d.toFixed ? d.toFixed(3) : d, 'alpha=', alpha.toFixed ? alpha.toFixed(3) : alpha); } catch (_) {}
        }
      }
    }

    // Pitch smoothing — SKIP entirely when mouse controls pitch
    if (!USE_MOUSE) {
      if (CONTROL_MODE === MODE_GYRO_AIM && USE_PITCH) {
        // Gyro mode: smooth toward pitchTarget + transient terrain nudge
        var pitchGoal = pitchTarget + (autoPitchOff || 0);
        var pitchDiff = pitchGoal - cam.pitch;
        cam.pitch += pitchDiff * pitchAlpha;
      } else {
        // Stick / keyboard only — apply transient terrain nudge directly
        cam.pitch = (cam.pitch || 0) + (autoPitchOff || 0) * 0.15;
        cam.pitch = Math.max(-CAM_PITCH_MAX, Math.min(CAM_PITCH_MAX, cam.pitch));
      }
    }

    // Camera follow
    if (CAM_FOLLOW) {
      cam.x = pos.x; cam.y = pos.y;
      if (pos.floorZ) cam.z = pos.floorZ;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    _pt('skybox3D', function(){ drawSkybox3D(); });
    _pt('ceiling3D', function(){ drawCeiling3D(); });
    _pt('platforms3D', function(){ drawPlatforms3D(); });
    _pt('walls3D', function(){ drawWalls3D(); });
    _pt('sceneEntities', function(){
      drawFloorScatter3D();
      drawTreasureChests3D();
      drawEnemySpawners3D();
      drawOreVeins();
      drawWallDecorations();
    });
    _pt('goalMarker3D', function(){ drawGoalMarker3D(); });
  } else {
    if (CONTROL_MODE === MODE_GYRO_AIM && USE_YAW && hasYaw) {
      var d2 = angNorm(yawTarget - cam.ang);
      cam.ang += d2 * yawAlpha;
    }
    draw2D();
    drawPlatforms2D();
  }
}


// =============================================
