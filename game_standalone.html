<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilt Maze - Standalone</title>
<style>
  :root { --panel-bg: #1a1a2e; --panel-fg: #e0e0e0; --border: #333355; }
  body { background: #0f0f1a; color: #e0e0e0; font-family: Arial, sans-serif; margin: 0; padding: 16px; }
  .btn { background: #2a2a4a; color: #e0e0e0; border: 1px solid #444466; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #3a3a5a; }
  .btn-small { font-size: 11px; padding: 4px 10px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .input-tall { background: #2a2a4a; color: #e0e0e0; border: 1px solid #444466; border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  .text-sm { font-size: 12px; }
  .text-muted { opacity: 0.6; }
  .space-top-sm { margin-top: 8px; }
  .space-top-md { margin-top: 12px; }
  .space-left-md { margin-left: 12px; }
.games-wrap{max-width:1000px;margin:0 auto}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1 1 320px} .card-light{background:var(--panel-bg);color:var(--panel-fg);border-radius:12px;padding:16px;border:1px solid var(--border)}
.hud{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-family:'Courier New',monospace;color:var(--panel-fg)}
canvas#maze{background:#000;border:1px solid var(--border);border-radius:4px}
</style>
</head>
<body>
<div class='games-wrap'>
  <h2>Games</h2>
  <p class='text-sm'>Client-side prototype for Tilt Maze. IMU polling starts when you click Start.</p>
  <div class='row'>
    <div class='col'>
      <div class='card-light'>
        <h3 style='margin-bottom:8px'>Tilt Maze</h3>
        <div class='btn-row'>
          <button class='btn' id='btnStart'>Start</button>
          <button class='btn' id='btnStop'>Stop</button>
          <select id='terrainSelect' class='input-tall' style='width:auto'>
            <option value='ground'>Ground</option>
            <option value='ice'>Icy</option>
            <option value='cave'>Cave</option>
            <option value='plains'>Plains</option>
            <option value='expanse'>Expanse</option>
          </select>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-left:12px' title='Use Seesaw gamepad to control the maze'>
            <input type='checkbox' id='chkGamepad'/> Gamepad
          </label>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-left:12px' title='Use WASD/arrows + mouse look to control the maze'>
            <input type='checkbox' id='chkKeyboard'/> Keyboard + Mouse
          </label>
        </div>
        <div class='space-top-sm text-sm'>
          <button class='btn btn-small' id='btnView2D'>2D View</button>
          <button class='btn btn-small' id='btnView3D'>3D View (beta)</button>
          <button class='btn btn-small' id='btnToggleTex'>Toggle Textures</button>
          <button class='btn btn-small' id='btnOverview' style='background:#2a3a2a;border-color:#446644'>🗺 Overview</button>
        </div>
        <div class='space-top-sm text-sm'>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer'>
            <input type='checkbox' id='chkImuDebug'/> IMU debug to console
          </label>
          <span class='space-left-md'></span>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer' title='Automatically show map overview when a level loads'>
            <input type='checkbox' id='chkAutoOverview' checked/> Auto overview on load
          </label>
          <span class='space-left-md'></span>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer'>
            <input type='checkbox' id='chk3dDebug'/> 3D debug overlay
          </label>
          <span class='space-left-md'></span>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer'>
            <input type='checkbox' id='chkTexDebug'/> Texture debug
          </label>
          <span class='space-left-md'></span>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer'>
            <input type='checkbox' id='chkFloorDebug'/> Floor debug
          </label>
          <span class='space-left-md'></span>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer'>
            <input type='checkbox' id='chkDecorDebug'/> Decoration debug
          </label>
          <span class='space-left-md'></span>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer' title='Show skeleton sprite sheet overlay with active frame highlighted'>
            <input type='checkbox' id='chkSkelDebug'/> Skeleton debug
          </label>
          <span class='space-left-md'></span>
          <label style='display:inline-flex;align-items:center;gap:6px;cursor:pointer' title='During 3D render, set camera position equal to player position'>
            <input type='checkbox' id='chkCamFollow'/> Sync camera to player
          </label>
          <span class='space-left-md'></span>
          <button class='btn btn-small' id='btnFwDbgOn' title='Enable firmware sensor debug flags'>FW Debug ON</button>
          <button class='btn btn-small' id='btnFwDbgOff' title='Disable firmware sensor debug flags'>FW Debug OFF</button>
        </div>
        <div class='hud'>
          <div>Level: <span id='hudLevel'>1</span></div>
          <div id='hudCal' class='text-muted'>Not calibrated</div>
          <div>Collisions: <span id='hudCol'>0</span></div>
          <div>Input: <span id='hudInput'>IMU</span></div>
        </div>
        <div class='space-top-md'>
          <canvas id='maze' width='360' height='240'></canvas>
        </div>
        <p class='text-sm space-top-sm'>Hold the device flat. Roll controls X, Pitch controls Y. Keep movements gentle.</p>
</div>

function toggleFullscreen() {
  var fs = document.fullscreenElement || document.webkitFullscreenElement
         || document.mozFullScreenElement || document.msFullscreenElement;
  if (!fs) {
    var req = canvas.requestFullscreen || canvas.webkitRequestFullscreen
            || canvas.mozRequestFullScreen || canvas.msRequestFullscreen;
    if (req) req.call(canvas);
  } else {
    var ex = document.exitFullscreen || document.webkitExitFullscreen
           || document.mozCancelFullScreen || document.msExitFullscreen;
    if (ex) ex.call(document);
  }
}

function onFullscreenChange() {
  var fs = document.fullscreenElement || document.webkitFullscreenElement
         || document.mozFullScreenElement || document.msFullscreenElement;
  if (fs === canvas) {
    // Entering fullscreen — expand draw buffer to the actual screen size.
    // A brief rAF ensures the browser has committed the new viewport size.
    requestAnimationFrame(function() {
      canvas.width  = window.innerWidth  || screen.width;
      canvas.height = window.innerHeight || screen.height;
    });
  } else {
    // Exiting fullscreen — restore authored resolution.
    canvas.width  = CANVAS_BASE_W;
    canvas.height = CANVAS_BASE_H;
  }
}
document.addEventListener('fullscreenchange',       onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
document.addEventListener('mozfullscreenchange',    onFullscreenChange);
document.addEventListener('MSFullscreenChange',     onFullscreenChange);

// =============================================
// SECTION 1: UTILITIES

function clamp(v, min, max) {
  return v < min ? min : (v > max ? max : v);
}

function deg2rad(d) {
  return d * Math.PI / 180;
}

function angNorm(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function seedFor(component) {
  return (BASE_SEED + level * 101 + component) | 0;
}

function rectsOverlap(a, b) {
  return !(a.x + a.w < b.x || a.x > b.x + b.w || a.y + a.h < b.y || a.y > b.y + b.h);
}


// =============================================
