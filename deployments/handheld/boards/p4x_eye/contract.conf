# HardwareOne deployment contract. Values are intentionally shell-free KEY=VALUE
# records so CMake and Python release tooling consume the exact same identity.
#
# Factory-only (OTA_LAYOUT=0): the ESP32-P4X-EYE has no recovery-OTA layout
# yet, so this release is one app image flashed over USB. The OTA-only keys
# (OTA_LAYOUT_ID, OTA_VERSION_SUFFIX, UPDATER_RELEASE_MAX) are deliberately
# absent and the loaders refuse them until a recovery layout exists.
DEPLOYMENT_ID=handheld
BOARD_ID=p4x_eye
TARGET=esp32p4
FLASH_SIZE=16MB
OTA_LAYOUT=0
PARTITION_CSV=deployments/handheld/boards/p4x_eye/partitions.csv
FEATURE_HEADER=deployments/handheld/boards/p4x_eye/features.h
# 7 MB factory partition (partitions.csv mirrors partitions/partitions_no_sr_16mb_p4x_eye.csv)
# minus a 64 KB margin for the release gate.
MAIN_RELEASE_MAX=0x705000
FLASH_ENCRYPTION=0
