      <path d="M0 0 H57.6 V5.6 H69 V32.6 H68.2 V37 H54 V38.3685 L52.759 43 H36.241 L35 38.3685 V37 H21.8 A.5 .5 0 0 1 21.3 36.5 V36.3 A.5 .5 0 0 0 20.8 35.8 H16.5 A.5 .5 0 0 0 16 36.3 V36.5 A.5 .5 0 0 1 15.5 37 H0 Z"/>
