## IDF Component Manager dependency file
## See: https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/tools/idf-component-manager.html

dependencies:
  # ESP32-Camera driver for XIAO ESP32S3 Sense camera support
  espressif/esp32-camera:
    version: "^2.0.0"
    rules:
      - if: "idf_version >=5.0"
  # libsodium — Ed25519/X25519/AEAD/PBKDF2 for ESP-NOW V4 Phase 3 crypto.
  # Espressif's port; provides full NaCl/libsodium API. Foundation for the
  # per-peer forward-secret session keys landed across Phase 3 sub-phases.
  espressif/libsodium:
    version: "^1.0.20"
    rules:
      - if: "idf_version >=5.0"
  # TensorFlow Lite Micro for runtime ML model loading
  espressif/esp-tflite-micro:
    version: "^1.3.0"
    rules:
      - if: "idf_version >=5.0"
  # ESP-SR for speech recognition (wake word + commands)
  espressif/esp-sr:
    version: "^1.4.0"
    rules:
      - if: "idf_version >=5.0"
        optional: true
