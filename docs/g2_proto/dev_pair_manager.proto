syntax = "proto3";

package even_connect.g2.dev_pair_manager;

import "common.proto";

// Sub-messages of DevCfgDataPackage (sid=128) for pairing/role/connection
// management. These are nested inside DevCfgDataPackage at the field tags
// listed in dev_config_protocol.proto.

enum eDevice {
  RING          = 0;
  GLASSES       = 1;
  RING_GLASSES  = 2;  // both
  PHONE_IOS     = 3;
  PHONE_ANDROID = 4;
}

enum eGlassesLR {
  BOTH  = 0;
  RIGHT = 1;
  LEFT  = 2;
}

enum eConnParamState {
  SLOW = 0;
  FAST = 1;
}

// AUTHENTICATION (eDevCfgCommandId = 4). NB: secAuth is just a bool —
// there is no actual cryptographic challenge/response in this message.
// "Authentication" here is a handshake declaration, not a verified pairing.
message AuthMgr {
  bool                       secAuth   = 1;
  eDevice                    phoneType = 2;
  even_connect.g2.common.eErrorCode result = 3;
}

// PIPE_ROLE_CHANGE (= 5). Phone tells one arm "you are the right (cmd)
// arm" so it knows to forward inter-arm traffic. Sent only to the right
// device by the official app.
message PipeRoleChange {
  eGlassesLR                 asCmdRole = 1;
  even_connect.g2.common.eErrorCode result = 2;
}

// RING_CONNECT_INFO (= 6). Tells the glasses which ring to listen for.
// `ringMac` is bytes (6 bytes, BYTE-REVERSED in the official app — see
// G2_R1_Canonical.h). `ringName` is bytes containing ASCII (e.g.
// "EVEN R1_112233").
message RingInfo {
  bool                       connectRing = 1;
  bytes                      ringMac     = 2;
  bytes                      ringName    = 3;
  int32                      connRet     = 4;
  even_connect.g2.common.eErrorCode result = 5;
}

// BLE_CONNECT_PARAM (= 7). MTU/conn-interval negotiation hint.
message BleConnectParam {
  int32                      MTU          = 1;
  int32                      connInterval = 2;
  eConnParamState            setSpeed     = 3;
  bool                       setSpeedRet  = 4;
  even_connect.g2.common.eErrorCode result = 5;
}

// DISCONNECT_INFO (= 8). Notifies device that a peer disconnected.
message DisconnectInfo {
  eDevice                    dev     = 1;
  bytes                      ringMac = 2;
  even_connect.g2.common.eErrorCode result = 3;
}

// UNPAIR_INFO (= 9). Forces unpairing of the named device.
message UnpairInfo {
  eDevice                    dev     = 1;
  bytes                      ringMac = 2;
  even_connect.g2.common.eErrorCode result = 3;
}
