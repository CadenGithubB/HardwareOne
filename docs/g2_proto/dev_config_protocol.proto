syntax = "proto3";

package even_connect.g2.dev_config_protocol;

import "common.proto";
import "dev_pair_manager.proto";
import "dev_settings.proto";

// =============================================================================
// DevCfgDataPackage — payload protobuf for sid=128 (UX_DEVICE_SETTINGS_APP_ID).
// =============================================================================
// This is the wrapper for ALL pairing/role/time/heartbeat traffic on sid=128.
// Field 1 selects which command this is; field 2 is the magic correlator;
// fields 3..129 are per-command nested sub-messages, only ONE of which is
// populated per packet.
//
// **FIRMWARE BRICK WARNING**: Firmware (G2_Glasses.cpp:9105+) blocks
// sid=0x80 in `g2probe` because past experiments with arbitrary payloads
// bricked devices. The schema below is reverse-engineered from the
// FlutterApp community project (not authoritative). Sending a well-formed
// DevCfgDataPackage MIGHT be safe IF this RE is correct AND your firmware
// version matches what the RE was done against. Test only on a unit you
// can physically reset.
//
// Possibly-related observed traffic on sid=0x80 (RX from glasses):
//   `08 06 10 <varint> 2A 00`
// IF FlutterApp's SID 128 = DevCfgDataPackage claim is correct, this
// decodes as: cmd=6 (RING_CONNECT_INFO), magicRandom=<varint>, ringInfo={}
// i.e. the device asking host "do you have a ring to bridge?". The fit is
// suspiciously clean, but the firmware also calls this "heartbeat-style"
// based on observed shape. Open question.

enum eDevCfgCommandId {
  NONE_COMMAND                = 0;
  CONNECT_PRO                 = 1;
  SERVICE_PRO                 = 2;
  COMMAND_PRO                 = 3;
  AUTHENTICATION              = 4;   // pairing announce; AuthMgr
  PIPE_ROLE_CHANGE            = 5;   // tell arm its L/R role
  RING_CONNECT_INFO           = 6;   // bridge ring MAC to glasses
  BLE_CONNECT_PARAM           = 7;   // MTU/conn interval hint
  DISCONNECT_INFO             = 8;
  UNPAIR_INFO                 = 9;
  COMMAND_EXCEPTION           = 10;
  SET_DEVICE_INFO             = 11;
  GET_DEVICE_INFO             = 12;
  RESTORE_TO_FACTORY_SETTINGS = 13;  // *** dangerous ***
  BASE_CONNECT_HEART_BEAT     = 14;  // 30 s keepalive (empty body)
  QUICK_RESTART               = 15;
  TIME_SYNC                   = 128; // wall-clock push
  AUD_CONTROL                 = 129; // mic stream open/close
  COMMAND_ERROR               = 255;
}

message DevCfgCmdException {
  eDevCfgCommandId            commandId = 1;
  even_connect.g2.common.eErrorCode result = 2;
}

message DevCfgDataPackage {
  eDevCfgCommandId                              commandId        = 1;
  int32                                         magicRandom      = 2;
  even_connect.g2.dev_pair_manager.AuthMgr       authMgr          = 3;   // cmd=4
  even_connect.g2.dev_pair_manager.PipeRoleChange roleChange      = 4;   // cmd=5
  even_connect.g2.dev_pair_manager.RingInfo      ringInfo         = 5;   // cmd=6
  even_connect.g2.dev_pair_manager.BleConnectParam connParam      = 6;   // cmd=7
  even_connect.g2.dev_pair_manager.DisconnectInfo disconnectInfo  = 7;   // cmd=8
  even_connect.g2.dev_pair_manager.UnpairInfo    unpairInfo       = 8;   // cmd=9
  DevCfgCmdException                             commandException = 9;   // cmd=10
  // setDeviceInfo                              = 10  (DeviceInfo, see dev_infomation.proto)
  // getDeviceInfo                              = 11  (DeviceInfo)
  even_connect.g2.dev_settings.RestoreFactory    restoreFactory   = 12;  // cmd=13
  even_connect.g2.dev_settings.BaseConnHeartBeat baseHeartBeat    = 13;  // cmd=14
  even_connect.g2.dev_settings.QuickRestart      quickRestart     = 14;  // cmd=15
  even_connect.g2.dev_settings.TimeSync          timeSync         = 128; // cmd=128
  even_connect.g2.dev_settings.AudControl        AudControl       = 129; // cmd=129
}
