syntax = "proto3";

package even_connect.g2.common;

// Result code shared across all G2 sub-packages. Returned in the `result` /
// `errorCode` field of nearly every reply message. SUCCESS=0 is the only
// "ok" value; everything else is a transport- or app-level failure.
enum eErrorCode {
  SUCCESS              = 0;
  CRC                  = 1;
  PKT_LOST             = 2;
  TIMEOUT              = 3;
  NO_RESOURCES         = 4;
  PB_ERROR             = 5;   // protobuf decode failure on device
  NULL                 = 6;
  FAIL                 = 7;
  NOT_SUPPORT          = 8;
  SUPPORT              = 9;
  HEAD_ID              = 10;  // unrecognised serviceId in envelope
  INVALID_LENGTH       = 11;
  INVALID_SDID         = 12;  // invalid sub-data id (sub-message field tag)
  DUPLICATE_PACKET     = 13;  // re-used syncId
  RING_CONNECT_TIMEOUT = 90;  // bridge-time-out from ring
}
