syntax = "proto3";

package even_connect.g2.ring;

import "common.proto";

// =============================================================================
// RingDataPackage — payload protobuf for sid=144 and sid=145.
// =============================================================================
// Once the ring-glasses bridge is established (see Ring_Bridge_Sequence.h),
// the glasses re-wrap ring data into this protobuf and forward it to the
// host. Two flavors:
//
//   commandId = EVENT     (1) → field 3 `event` carries RingEvent
//   commandId = RAW_DATA  (2) → field 4 `rawData` carries RingRawData
//
// SID layout (decoder routes BOTH SIDs to the same RingDataPackage type):
//   sid=144 (UX_RING_ROW_DATA_ID)   — observed: ring telemetry (RingRawData)
//   sid=145 (UX_RING_DATA_RELAY_ID) — observed: ring events  (RingEvent)
//
// The exact split is RE-inferred (see G2_PROTO_DECODER at
// docs/FlutterApp-main/lib/src/protocol/g2_proto_decoder.dart:59-60).
// In practice, treat both SIDs as carrying RingDataPackage; the
// commandId field tells you which sub-message is populated.

enum eRingCommandId {
  NONE_COMMAND = 0;
  EVENT        = 1;  // RingEvent populated
  RAW_DATA     = 2;  // RingRawData populated
}

enum eRingEvent {
  UNKNOWN_EVENT = 0;
  BLE_ADV       = 1;  // ring is advertising / has advertised
}

// Discrete event from the ring (currently only BLE_ADV is defined).
message RingEvent {
  bytes                              ringMac    = 1;  // ring's BLE MAC
  eRingEvent                         eventId    = 2;
  int32                              eventParam = 3;  // event-specific
  even_connect.g2.common.eErrorCode  errorCode  = 4;
}

// Periodic telemetry sample from the ring. ALL fields are optional; the
// glasses populate only the fields that are fresh since the last sample.
//
// Timestamps appear to be Unix seconds (s32) — verify against your captures.
//
// **This is the structure your firmware will receive on sid=144/145
// once the bridge is up.** Decoder at G2_Glasses.cpp can be extended to
// dispatch this protobuf and surface fields to whatever consumer needs
// them (display widget, MQTT, SD log, etc.).
message RingRawData {
  int32                              battery           = 1;   // % charge
  int32                              chargeStates      = 2;   // BleRing1ChargeStatus
                                                              // (0=unk,1=charging,
                                                              // 2=notCharging,3=full)
  int32                              hr                = 3;   // bpm
  int32                              hrTimestamp       = 4;   // unix s
  int32                              spo2              = 5;   // %
  int32                              spo2Timestamp     = 6;   // unix s
  int32                              hrv               = 7;   // ms (RMSSD?)
  int32                              hrvTimestamp      = 8;   // unix s
  int32                              temp              = 9;   // 0.1°C? verify
  int32                              tempTimestamp     = 10;  // unix s
  int32                              actKcal           = 11;  // active kcal today
  int32                              actKcalTimestamp  = 12;  // unix s
  int32                              allKcal           = 13;  // total kcal today
  int32                              allKcalTimestamp  = 14;  // unix s
  int32                              steps             = 15;  // step count today
  int32                              stepsTimestamp    = 16;  // unix s
  even_connect.g2.common.eErrorCode  errorCode         = 17;
}

// Top-level wrapper. commandId (field 1) selects which of the optional
// sub-messages (3 or 4) is populated.
message RingDataPackage {
  eRingCommandId   commandId   = 1;
  int32            magicRandom = 2;
  RingEvent        event       = 3;  // if commandId == EVENT
  RingRawData      rawData     = 4;  // if commandId == RAW_DATA
}
