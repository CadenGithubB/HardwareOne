syntax = "proto3";

package even_connect.g2.r1_ring_enums;

// =============================================================================
// R1 Ring sub-command and status enums — *** BEST-EFFORT RE ***
// =============================================================================
//
// **WARNING — DOUBLE-RE'D CONTENT**
//
// 1. The R1 wire envelope itself is flagged "best-effort from partial
//    reverse engineering" in the FlutterApp authors' own README.md:49-52
//    and AGENTS.md:336.
//
// 2. The enum integer values below are the 0-indexed *Dart enum positions*,
//    not necessarily the on-the-wire opcode bytes. The actual wire opcode
//    bytes used by FlutterApp's r1_messages.dart implementation differ
//    (e.g. wire pairAuth = 0x08, but BleRing1SubCmd_pairAuth = 7 here).
//    For the WIRE codes that FlutterApp actually transmits and that match
//    captured traffic, see R1_RE_Reference.h or the test fixtures in
//    docs/FlutterApp-main/test/protocol/r1_messages_test.dart.
//
// Treat this file as a NAME REFERENCE only — useful to identify what an
// observed sub-cmd is "called", not to derive the wire byte.
//
// =============================================================================

