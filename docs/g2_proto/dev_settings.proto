syntax = "proto3";

package even_connect.g2.dev_settings;

import "common.proto";

// Sub-messages of DevCfgDataPackage (sid=128) for time/heartbeat/audio.

enum eAudCmd {
  AUD_CMD_NONE   = 0;
  AUD_CMD_OPEN   = 1;
  AUD_CMD_CLOSE  = 2;
  AUD_CMD_PAUSE  = 3;
  AUD_CMD_RESUME = 4;
}

// TIME_SYNC (eDevCfgCommandId = 128). Phone pushes wall-clock time.
// `timestamp` is unix seconds (s32). `timezone` is encoded as quarter-hour
// offset from UTC (so PST = -32, JST = +36) — see official app's r1
// systemTime fixture for confirmation. NB: int64 even though range fits
// int16, possibly to allow microsecond timestamps in future.
message TimeSync {
  int32                      timestamp = 1;
  int64                      timezone  = 2;
  even_connect.g2.common.eErrorCode result = 3;
}

// BASE_CONNECT_HEART_BEAT (= 14). Empty body except for ack `result`.
// Sent by phone every 30 s while connected.
message BaseConnHeartBeat {
  even_connect.g2.common.eErrorCode result = 1;
}

// QUICK_RESTART (= 15). Triggers fast restart.
message QuickRestart {
  even_connect.g2.common.eErrorCode result = 1;
}

// RESTORE_TO_FACTORY_SETTINGS (= 13). Self-explanatory; danger.
message RestoreFactory {
  even_connect.g2.common.eErrorCode result = 1;
}

// AUD_CONTROL (= 129). Mic stream open/close/pause/resume. The firmware
// implements this in its EvenCore subsystem (G2_CMD_AUDIO_CTRL=15 on
// sid=0xE0) instead — different SID, different opcode space, but
// equivalent function. The `status` field semantics are device-specific.
message AudControl {
  eAudCmd                    cmd    = 1;
  int32                      status = 2;
  even_connect.g2.common.eErrorCode result = 3;
}
