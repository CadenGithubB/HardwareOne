syntax = "proto3";

package even_connect.g2.service_id_def;

// SID — byte 6 of the G2 envelope. Routes the protobuf payload to a
// subsystem on the device. See components/hardwareone/G2_Proto_Canonical.h
// for cross-references against the firmware's existing G2_SID_* defines and
// notes on observed name discrepancies (esp. 0x0E and 0x80).
enum SID {
  UI_DEFAULT_APP_ID                       = 0;
  UI_BACKGROUND_DASHBOARD_APP_ID          = 1;   // dashboard (news/stocks/weather)
  // 2 = reserved/unused
  UI_FOREGROUND_MEUN_ID                   = 3;   // [sic] menu (typo preserved)
  UI_FOREGROUND_NOTIFICATION_ID           = 4;
  UI_TRANSLATE_APP_ID                     = 5;
  UI_TELEPROMPT_APP_ID                    = 6;
  UI_FOREGROUND_EVEN_AI_ID                = 7;
  UI_BACKGROUND_NAVIGATION_ID             = 8;
  UI_SETTING_APP_ID                       = 9;
  UI_TRANSCRIBE_APP_ID                    = 10;
  UI_CONVERSATE_APP_ID                    = 11;
  UI_QUICKLIST_APP_ID                     = 12;
  SERVICE_SYNC_INFO_APP_ID                = 13;  // gestures/state events
  UI_HEALTH_APP_ID                        = 14;  // canonical: health. firmware
                                                 // observes widget-transform here
  UI_LOGGER_APP_ID                        = 15;
  UI_ONBOARDING_APP_ID                    = 16;
  // 17..31 = reserved
  SERVICE_MODULE_CONFIGURE_APP_ID         = 32;
  UI_FOREGROUND_SYSTEM_ALERT_APP_ID       = 33;
  UI_FOREGROUND_SYSTEM_CLOSE_APP_ID       = 34;
  // 35..127 = reserved
  UX_DEVICE_SETTINGS_APP_ID               = 128; // DevCfgDataPackage —
                                                 // AUTHENTICATION, TIME_SYNC,
                                                 // RING_CONNECT_INFO, etc.
                                                 // **Firmware brick risk if
                                                 // sent with wrong payload.**
  UX_GLASSES_CASE_APP_ID                  = 129;
  // 130..143 = reserved
  UX_RING_ROW_DATA_ID                     = 144; // raw ring telemetry
  UX_RING_DATA_RELAY_ID                   = 145; // ring → glasses bridge events
  // 146..191 = reserved
  UX_OTA_TRANSMIT_CMD_ID                  = 192; // OTA cmd channel
  UX_OTA_TRANSMIT_RAW_DATA_ID             = 193; // OTA raw firmware bytes
  UX_OTA_EXPORT_FILE_CMD_ID               = 194;
  UX_OTA_EXPORT_FILE_RAW_DATA_ID          = 195;
  UX_EVEN_FILE_SERVICE_CMD_SEND_ID        = 196; // generic file send cmd
                                                 // (carries notification JSON)
  UX_EVEN_FILE_SERVICE_RAW_SEND_DATA_ID   = 197; // file send raw payload
  UX_EVEN_FILE_SERVICE_CMD_EXPORT_ID      = 198; // generic file export cmd
  UX_EVEN_FILE_SERVICE_RAW_EXPORT_DATA_ID = 199; // file export raw payload
  // 200..223 = reserved
  UI_BACKGROUND_EVENHUB_APP_ID            = 224; // back-pane render surface
                                                 // (firmware calls this
                                                 // "EvenCore")
  // 225..254 = reserved
  INVALID_SERVICE_ID                      = 255;
}
